stages:
  - test

e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    CI: "true"
  # RON_USERNAME / RON_PASSWORD khai bao o Settings > CI/CD > Variables (Masked)
  script:
    - npm ci
    - npm run typecheck
    - npx playwright test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
